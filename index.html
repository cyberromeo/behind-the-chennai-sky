<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Beneath the Chennai Sky</title>
  <meta name="description" content="Beneath the Chennai Sky — An immersive lyrical experience. Listen, feel, drift.">
  <meta name="theme-color" content="#05070f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="assets/covers/chennai-sky-384.jpg">

  <!-- Open Graph / Facebook / WhatsApp -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chennaisky.vercel.app/">
  <meta property="og:title" content="Beneath the Chennai Sky">
  <meta property="og:description" content="An immersive lyrical experience by RIKA AND SRIHARI.">
  <meta property="og:image" content="https://chennaisky.vercel.app/og-image.jpg">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://chennaisky.vercel.app/">
  <meta name="twitter:title" content="Beneath the Chennai Sky">
  <meta name="twitter:description" content="An immersive lyrical experience by RIKA AND SRIHARI.">
  <meta name="twitter:image" content="https://chennaisky.vercel.app/og-image.jpg">

  <link rel="preload" href="assets/fonts/InstrumentSerif-italic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/Inter-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/covers/chennai-sky-384.jpg" as="image">
  <link rel="stylesheet" href="styles.css">

  <!-- Vercel Web Analytics -->
  <script src="va.js"></script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <!-- Desktop-only side note; on phones the app fills the screen -->
  <aside class="desk-note" aria-hidden="true">
    <p class="desk-eyebrow">a lyrical journey</p>
    <p class="desk-title">Beneath the<br><em>Chennai Sky</em></p>
    <p class="desk-copy">Made for your phone. Open it on mobile, put your headphones on, and drift.</p>
  </aside>

  <div class="app" id="app" data-screen="intro">
    <!-- Night sky, sea, lighthouse and gopuram, drawn live -->
    <canvas id="sky" aria-hidden="true"></canvas>

    <!-- ═══════════════ INTRO SCREEN ═══════════════ -->
    <main id="intro-screen" class="screen intro is-active" aria-label="Songs">
      <div class="intro-top">
        <div class="fan reveal" style="--d:150ms" id="art-card" aria-hidden="true">
          <div class="fan-tilt" id="art-tilt">
            <img src="assets/covers/poitu-night-384.jpg" alt="" class="fan-card fan-3" width="384" height="384">
            <img src="assets/covers/poitu-rika-384.jpg" alt="" class="fan-card fan-2" width="384" height="384">
            <img src="assets/covers/chennai-sky-384.jpg" alt="" class="fan-card fan-1" width="384" height="384">
          </div>
          <span class="art-glow"></span>
        </div>

        <h1 class="title" aria-label="Beneath the Chennai Sky">
          <span class="t1 reveal" style="--d:450ms">beneath</span>
          <span class="t2 reveal" style="--d:650ms">the Chennai</span>
          <span class="t3 reveal" style="--d:850ms" data-split>Sky</span>
        </h1>
        <p class="subtitle reveal" style="--d:1200ms"><span class="dash"></span>a lyrical journey<span class="dash"></span></p>
        <p class="meta reveal" style="--d:1350ms">RIKA AND SRIHARI</p>
      </div>

      <div class="intro-bottom">
        <div class="list-head reveal" style="--d:1500ms"><span>Songs</span><span id="list-count">3 tracks</span></div>
        <ol class="tracklist" id="tracklist"></ol>
        <button id="start-btn" class="start-btn reveal" style="--d:2100ms" type="button">
          <span class="start-ring" aria-hidden="true"></span>
          <span class="start-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>
          </span>
          <span class="start-label" id="start-label">Start Listening</span>
        </button>
      </div>
    </main>

    <!-- ═══════════════ PLAYER SCREEN ═══════════════ -->
    <section id="player-screen" class="screen player" aria-label="Player" hidden>
      <div class="player-bg" aria-hidden="true"><div class="player-bg-img"></div></div>

      <div class="fx" id="fx" aria-hidden="true">
        <div class="fx-sky"></div><div class="fx-sun"></div><div class="fx-rays"></div><div class="fx-bloom"></div><div class="fx-glow"></div>
        <svg class="fx-sketch" viewBox="0 0 390 200" preserveAspectRatio="xMidYMin meet"><path pathLength="1" d="M150 160c-6-30 2-62 30-74 26-11 52 2 60 26 8 23-2 46-14 60M178 92c-10 10-14 26-10 40M196 118c2 6 8 8 12 4M201 140c6 3 12 2 16-3M120 196c18-14 44-20 64-22M282 196c-16-14-36-20-54-22"/><path pathLength="1" d="M40 30c40 10 80-6 120 4s70 8 104-2 70-6 90 6"/></svg>
        <svg class="fx-const" viewBox="0 0 390 200" preserveAspectRatio="xMidYMin meet"><line x1="60" y1="150" x2="110" y2="95" pathLength="1"/><line x1="110" y1="95" x2="170" y2="120" pathLength="1"/><line x1="170" y1="120" x2="225" y2="60" pathLength="1"/><line x1="225" y1="60" x2="285" y2="100" pathLength="1"/><line x1="285" y1="100" x2="330" y2="45" pathLength="1"/><circle cx="60" cy="150" r="2.2" style="--k:0"/><circle cx="110" cy="95" r="2.2" style="--k:1"/><circle cx="170" cy="120" r="2.2" style="--k:2"/><circle cx="225" cy="60" r="2.2" style="--k:3"/><circle cx="285" cy="100" r="2.2" style="--k:4"/><circle cx="330" cy="45" r="2.2" style="--k:5"/></svg>
        <div class="fx-diyas"><i></i><i></i><i></i><i></i><i></i></div>
        <div class="fx-motes"><i style="--k:0;left:46%;top:68%"></i><i style="--k:1;left:24%;top:33%"></i><i style="--k:2;left:88%;top:11%"></i><i style="--k:3;left:14%;top:60%"></i><i style="--k:4;left:73%;top:14%"></i><i style="--k:5;left:51%;top:45%"></i><i style="--k:6;left:12%;top:66%"></i><i style="--k:7;left:69%;top:21%"></i><i style="--k:8;left:9%;top:13%"></i><i style="--k:9;left:60%;top:34%"></i><i style="--k:10;left:13%;top:23%"></i><i style="--k:11;left:16%;top:43%"></i><i style="--k:12;left:59%;top:11%"></i><i style="--k:13;left:77%;top:15%"></i></div>
        <div class="fx-dim"><i></i></div>
      </div>
      <header class="topbar">
        <div class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <span class="topbar-label">Now Playing</span><span class="topbar-count" id="track-count">1 / 3</span>
      </header>

      <div class="views" id="views" data-view="lyrics">
        <!-- Lyrics view -->
        <div id="lyrics-viewport" class="view lyrics-viewport" role="region" aria-label="Lyrics">
          <div id="lyrics-container" class="lyrics-container"></div>
        </div>
        <button id="follow-btn" class="follow-btn" type="button" hidden>
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
          Back to now
        </button>

        <!-- Cover view -->
        <div class="view cover-view" id="cover-view" aria-label="Cover">
          <div class="cover-art-wrap">
            <img src="assets/covers/chennai-sky-768.jpg" width="768" height="768" alt="Album Art" class="cover-art" id="album-img-player">
            <span class="art-sheen"></span>
          </div>
          <p class="cover-line" id="cover-line" aria-live="polite">&nbsp;</p>
        </div>
      </div>

      <div class="dock">
        <div class="track">
          <img src="assets/covers/chennai-sky-384.jpg" alt="" class="track-thumb" id="dock-thumb" width="48" height="48">
          <div class="track-info">
            <p class="track-title" id="dock-title">Beneath the Chennai Sky</p>
            <p class="track-artist" id="dock-artist">RIKA AND SRIHARI</p>
          </div>
        </div>

        <div class="scrub" id="progress-wrapper" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="scrub-bar">
            <div class="scrub-fill" id="progress-fill"></div>
            <div class="scrub-thumb" id="progress-thumb"></div>
          </div>
          <div class="time-display">
            <span id="current-time">0:00</span>
            <span id="total-time">0:00</span>
          </div>
        </div>

        <div class="controls">
          <button id="prev-track" class="ctrl ctrl-sm" type="button" aria-label="Previous song">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><rect x="4" y="5" width="2.6" height="14" rx="1"/><path d="M20 6.2v11.6a1 1 0 0 1-1.55.83L9.6 12.83a1 1 0 0 1 0-1.66l8.85-5.8A1 1 0 0 1 20 6.2z"/></svg>
          </button>
          <button id="prev-btn" class="ctrl" type="button" aria-label="Back 10 seconds">
            <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><text x="12" y="15.6" text-anchor="middle" font-size="7.5" font-weight="700" fill="currentColor" stroke="none" font-family="Inter, sans-serif">10</text></svg>
          </button>
          <button id="play-pause-btn" class="ctrl ctrl-main" type="button" aria-label="Play">
            <svg class="icon-play" viewBox="0 0 24 24" width="30" height="30" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>
            <svg class="icon-pause" viewBox="0 0 24 24" width="30" height="30" fill="currentColor" aria-hidden="true"><rect x="5.5" y="4" width="4.5" height="16" rx="1.4"/><rect x="14" y="4" width="4.5" height="16" rx="1.4"/></svg>
          </button>
          <button id="next-btn" class="ctrl" type="button" aria-label="Forward 10 seconds">
            <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/><text x="12" y="15.6" text-anchor="middle" font-size="7.5" font-weight="700" fill="currentColor" stroke="none" font-family="Inter, sans-serif">10</text></svg>
          </button>
          <button id="next-track" class="ctrl ctrl-sm" type="button" aria-label="Next song">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><rect x="17.4" y="5" width="2.6" height="14" rx="1"/><path d="M4 6.2v11.6a1 1 0 0 0 1.55.83l8.85-5.8a1 1 0 0 0 0-1.66L5.55 5.37A1 1 0 0 0 4 6.2z"/></svg>
          </button>
        </div>

        <nav class="tabbar" aria-label="Views">
          <span class="tab-pill" aria-hidden="true"></span>
          <button class="tab" type="button" data-go="intro" aria-label="Songs">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>
            <span>Songs</span>
          </button>
          <button class="tab is-on" type="button" data-view="lyrics" aria-pressed="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 11h11M4 16h14M4 21h7"/></svg>
            <span>Lyrics</span>
          </button>
          <button class="tab" type="button" data-view="cover" aria-pressed="false">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="3.5"/><circle cx="12" cy="12" r="3.2"/></svg>
            <span>Cover</span>
          </button>
        </nav>
      </div>
    </section>

    <!-- Audio element -->
    <audio id="audio-player" preload="metadata"></audio>
  </div>

  <script src="app.js"></script>
</body>
</html>
