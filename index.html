<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Lewis Hamilton — Silverstone</title>
    <meta name="description" content="Lewis Hamilton at Silverstone — a Formula 1 driver profile experience." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="hero" aria-label="Formula 1 driver profile">
      <img
        class="page-background"
        src="https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260709_152331_bd312d1a-1f20-46b9-9b68-12bcdcf6d53e.png&w=1280&q=85"
        alt=""
        aria-hidden="true"
      />
      <div class="page-overlay" aria-hidden="true"></div>

      <section class="phones desktop-phones" aria-label="Driver overview">
        <article class="phone-wrap phone-delay-300">
          <div class="phone-frame">
            <div class="phone-side left one"></div><div class="phone-side left two"></div><div class="phone-side left three"></div><div class="phone-side right"></div>
            <div class="phone-screen">
              <div class="screen-content hero-screen">
                <img class="screen-background" src="https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260709_152331_bd312d1a-1f20-46b9-9b68-12bcdcf6d53e.png&w=1280&q=85" alt="" aria-hidden="true" />
                <div class="screen-overlay"></div>
                <nav class="phone-nav">
                  <img class="f1-logo" src="https://framerusercontent.com/images/NZPITJ6zDBvxVT7rc1NH2sOU.png" alt="Formula 1" />
                  <div class="nav-actions"><button class="nav-button profile-button" aria-label="Open profile"><img src="https://framerusercontent.com/images/JIl4japgQlMAQRvh1gDHszRvkUY.png?width=92&height=92" alt="" /></button><button class="nav-button menu-button" aria-label="Open navigation menu"><span></span><span></span></button></div>
                </nav>
                <div class="hero-location reveal-up delay-300"><div class="eyebrow">United Kingdom <img src="https://framerusercontent.com/images/pqUTggaeyOivtzDImRzkBRdww.png" alt="UK flag" /></div><h1>Silverstone<br />England</h1></div>
                <div class="driver-photo"><img src="https://framerusercontent.com/images/m5IyHuJeOQ5P0GOvWx1xv0IR9Y.png" alt="Lewis Hamilton" /><div class="photo-blur"></div></div>
                <div class="hero-bottom"><img class="avatar-strip reveal-up delay-700" src="https://framerusercontent.com/images/dAAdqktZVxBDjPKk97YCjZjsE.png" alt="Driver portraits" /><h2 class="driver-name speed-reveal delay-800">Lewis<br />Hamilton</h2></div>
              </div>
            </div>
          </div>
        </article>

        <article class="phone-wrap phone-delay-500 phone-middle">
          <div class="phone-frame">
            <div class="phone-side left one"></div><div class="phone-side left two"></div><div class="phone-side left three"></div><div class="phone-side right"></div>
            <div class="phone-screen">
              <div class="screen-content stats-screen">
                <img class="screen-background" src="https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260709_152331_bd312d1a-1f20-46b9-9b68-12bcdcf6d53e.png&w=1280&q=85" alt="" aria-hidden="true" />
                <div class="screen-overlay"></div>
                <nav class="phone-nav"><img class="f1-logo" src="https://framerusercontent.com/images/NZPITJ6zDBvxVT7rc1NH2sOU.png" alt="Formula 1" /><div class="nav-actions"><button class="nav-button profile-button" aria-label="Open profile"><img src="https://framerusercontent.com/images/JIl4japgQlMAQRvh1gDHszRvkUY.png?width=92&height=92" alt="" /></button><button class="nav-button menu-button" aria-label="Open navigation menu"><span></span><span></span></button></div></nav>
                <div class="stats-inner"><div class="location-block reveal-up delay-400"><div class="eyebrow">United Kingdom <img src="https://framerusercontent.com/images/pqUTggaeyOivtzDImRzkBRdww.png" alt="UK flag" /></div><h1>Silverstone<br />England</h1></div><div class="circuit reveal-scale delay-600"><img src="https://framerusercontent.com/images/raKAG2bJP9xeqi118VMniPLvbAA.png" alt="Silverstone circuit map" /></div><div class="season-points reveal-up delay-800"><div class="points-label">Season Points <img src="https://framerusercontent.com/images/pIXUcwyAF0xzCIaKjtNLahHpasQ.png" alt="Medal" /></div><div class="point-row"><strong class="count-up pale" data-target="227">0</strong><strong class="count-up pale" data-target="374">0</strong><strong class="count-up yellow" data-target="4987">0</strong></div></div></div>
              </div>
            </div>
          </div>
        </article>

        <article class="phone-wrap phone-delay-700">
          <div class="phone-frame">
            <div class="phone-side left one"></div><div class="phone-side left two"></div><div class="phone-side left three"></div><div class="phone-side right"></div>
            <div class="phone-screen">
              <div class="screen-content team-screen">
                <img class="screen-background" src="https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260709_152331_bd312d1a-1f20-46b9-9b68-12bcdcf6d53e.png&w=1280&q=85" alt="" aria-hidden="true" />
                <div class="screen-overlay"></div>
                <nav class="phone-nav"><img class="f1-logo" src="https://framerusercontent.com/images/NZPITJ6zDBvxVT7rc1NH2sOU.png" alt="Formula 1" /><div class="nav-actions"><button class="nav-button profile-button" aria-label="Open profile"><img src="https://framerusercontent.com/images/JIl4japgQlMAQRvh1gDHszRvkUY.png?width=92&height=92" alt="" /></button><button class="nav-button menu-button" aria-label="Open navigation menu"><span></span><span></span></button></div></nav>
                <div class="team-copy reveal-up delay-300"><div class="eyebrow">Team Name <img src="https://framerusercontent.com/images/sUDhzMuxKIOvqjSH5U1fn0QSXqI.png" alt="Ferrari" /></div><h1>Scuderia<br />Ferrari</h1></div>
                <div class="chassis reveal-up delay-500"><div class="eyebrow"><img src="https://framerusercontent.com/images/zIA1tYDOAdZo3k6IXX9gBC5FGbY.png" alt="Chassis" /> Chassis</div><strong>SF-26</strong></div>
                <img class="ferrari reveal-left delay-700" src="https://framerusercontent.com/images/MzKCSYB4uVt9psQq4jRwQNRDjc.png" alt="Ferrari SF-26" />
                <div class="driver-cards reveal-up delay-900"><div class="driver-card"><div class="card-title">Charles Leclerc <img src="https://framerusercontent.com/images/JIl4japgQlMAQRvh1gDHszRvkUY.png?width=92&height=92" alt="" /></div><img class="card-stat" src="https://framerusercontent.com/images/MJfqhcmEoIBnfimJNhKqoZpq0.png" alt="Leclerc statistics" /><strong>16</strong></div><div class="driver-card"><div class="card-title">Lewis Hamilton <img src="https://framerusercontent.com/images/JIl4japgQlMAQRvh1gDHszRvkUY.png?width=92&height=92" alt="" /></div><img class="card-stat" src="https://framerusercontent.com/images/3EwXxC1QutaGnlNDZMlAN66ZmTU.png" alt="Hamilton statistics" /><strong>44</strong></div></div>
              </div>
            </div>
          </div>
        </article>
      </section>

      <section class="phones mobile-phones" aria-label="Driver overview">
        <div class="mobile-phone-slot"></div>
      </section>

      <div class="menu-overlay" aria-hidden="true"><button class="close-menu" aria-label="Close navigation menu">×</button><div class="menu-content"><span class="menu-kicker">Formula 1 / Driver profile</span><a href="#biography">Biography</a><a href="#statistics">Statistics</a><a href="#career">Career</a><button class="sign-in">Sign in</button></div></div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
